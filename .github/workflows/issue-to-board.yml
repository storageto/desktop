name: issue-to-board
# Sync ISSUES onto Project #6 "Ryan Badger - Everything", mirroring the label as the source of truth:
#   ready label -> Ready column   |   no label -> Backlog   |   in-progress -> leave it to /work.
# Companion to pr-to-board.yml (which handles PRs). Needs the PROJECT_PAT secret (project scope).
on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
permissions: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          PID=PVT_kwHOAAxcw84BdFLu; SF=PVTSSF_lAHOAAxcw84BdFLuzhXpVz4
          BACKLOG=45906b97; READY=e1fc5be3
          has(){ echo "$LABELS" | grep -q "\"$1\""; }
          if has in-progress; then echo "in-progress -> leaving board state to /work"; exit 0; fi
          iid=$(gh project item-add 6 --owner ryanbadger --url "$ISSUE_URL" --format json --jq .id)
          if has ready; then OPT=$READY; else OPT=$BACKLOG; fi
          gh api graphql -f query="mutation{updateProjectV2ItemFieldValue(input:{projectId:\"$PID\",itemId:\"$iid\",fieldId:\"$SF\",value:{singleSelectOptionId:\"$OPT\"}}){projectV2Item{id}}}"
